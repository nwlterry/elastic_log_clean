name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (e.g. v1.2.0)
        required: true
        default: v1.2.0
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Cross-compile packages
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: bash hack/package.sh "$VERSION"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: elastic_log_clean ${{ github.event.inputs.version || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/*
          body: |
            Unpack and run. Windows 11: use elastic_log_clean.ps1 after copying a diagnostics zip or server log off the host.

            ```bash
            tar -xzf elastic_log_clean_1.2.0_linux_amd64.tar.gz
            ./elastic_log_clean -v -i diagnostics.zip -o scrubbed-diagnostics.zip
            ```

            ```powershell
            .\elastic_log_clean.ps1 -InputPath .\local-diagnostics.zip -VerboseLog
            ```
