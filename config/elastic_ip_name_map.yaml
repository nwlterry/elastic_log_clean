# Sample: auto IP tokens + pinned IP/hostname → custom names.
#
# -c replaces the built-in config (it does not merge). Keep omit + Secrets
# if you still want keystore files dropped and passwords redacted.
#
# Keywords run before IP. Mapped IPs are not rewritten to x-ipv4-… tokens.
# Unmapped IPs still get consistent tokens (x-ipv4-0000000001-x).
# Loopback 127.0.0.1 / 0.0.0.0 / ::1 is never rewritten.
#
# Do not commit a filled-in copy of this file, or report.yaml.

config:
  omit:
    - type: File
      pattern: "**/*.p12"
    - type: File
      pattern: "**/*.jks"
    - type: File
      pattern: "**/*.keystore"
    - type: File
      pattern: "**/*.truststore"
    - type: File
      pattern: "**/*private*key*"
    - type: File
      pattern: "**/elasticsearch.keystore"
    - type: File
      pattern: "**/users"
    - type: File
      pattern: "**/users_roles"

  obfuscate:
    - type: IP
      replacementType: Consistent
      target: All
    - type: MAC
      replacementType: Consistent
      target: All
    - type: Email
      replacementType: Consistent
      target: FileContents
    - type: Secrets
      enabled: true
    - type: PEM
      enabled: true
    - type: Keywords
      target: FileContents
      replacement:
        10.20.30.41: node-a
        10.20.30.42: node-b
        es-prod-01: node-a
        es-prod-02: node-b
    - type: Keywords
      target: FilePath
      replacement:
        es-prod-01: node-a
        es-prod-02: node-b
    # - type: Domain
    #   replacementType: Consistent
    #   target: All
    #   domainNames:
    #     - example.internal
    #     - corp.local
