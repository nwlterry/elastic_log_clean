# Default Elastic diagnostic / cluster / server log cleaner.
# Schema follows OpenShift must-gather-clean: omit + obfuscate.
#
# Do not commit a generated report.yaml — it maps real values to tokens.

config:
  omit:
    - type: File
      pattern: "**/*.p12"
    - type: File
      pattern: "**/*.jks"
    - type: File
      pattern: "**/*.keystore"
    - type: File
      pattern: "**/*.truststore"
    - type: File
      pattern: "**/*private*key*"
    - type: File
      pattern: "**/elasticsearch.keystore"
    - type: File
      pattern: "**/users"
    - type: File
      pattern: "**/users_roles"

  obfuscate:
    - type: IP
      replacementType: Consistent
      target: All
    - type: MAC
      replacementType: Consistent
      target: All
    - type: Email
      replacementType: Consistent
      target: FileContents
    - type: Secrets
      enabled: true
    - type: PEM
      enabled: true
    # Uncomment and list internal DNS suffixes to rewrite consistently.
    # - type: Domain
    #   replacementType: Consistent
    #   target: All
    #   domainNames:
    #     - example.internal
    #     - corp.local
    # Uncomment to rewrite host/node names in paths and contents.
    # - type: Keywords
    #   target: FileContents
    #   replacement:
    #     es-prod-01: node-a
    #     es-prod-02: node-b
    # - type: Keywords
    #   target: FilePath
    #   replacement:
    #     es-prod-01: node-a
    #     es-prod-02: node-b
